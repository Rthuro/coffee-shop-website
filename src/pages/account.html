<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <header class="flex items-center justify-between maxWidth mx-auto py-8 px-4 bg-customCream">
    </header>
    <main class="relative shadow-sm rounded-sm flex flex-col items-center justify-center gap-3 p-6 my-9 h-[60vh] bg-customBlue w-[500px] mx-auto ">
        <img src="../assets/images/cat.png" alt="" >
        <p class="text-customCream font-light text-lg" id="accEmail"></p>
        <button id="logOut" class="w-[250px] bg-customCream py-2 border-none rounded-sm text-center">Log out</button>
        <button id="deleteAcc" class="w-[250px] bg-transparent py-2 border border-customCream text-customCream rounded-sm">Delete Account</button>
    </main>
    <footer class="h-64 mt-56 flex items-start justify-around maxWidth mx-auto">
    </footer>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module">
    import { head, header, footer } from "/src/components/layout.js";
    document.addEventListener('DOMContentLoaded', ()=>{
        const currentUser = localStorage.getItem('currentUserEmail');
        if(currentUser == "null" || currentUser == null || !currentUser){
        window.location.href = "/index.html";
        } else {
            head('Account');
            header('Account');
            footer();
            lucide.createIcons();
            const accEmail = document.getElementById('accEmail');
            const logOut = document.getElementById('logOut');
            const deleteAcc = document.getElementById('deleteAcc');
            accEmail.innerHTML = localStorage.getItem("currentUserEmail");

            logOut.addEventListener('click', ()=>{
                localStorage.setItem('currentUserEmail',null);
                localStorage.setItem('currentUserPass',null);
                window.location.href = "/index.html";
            });
        }
    });
</script>
</html>
