<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <header class="flex items-center justify-between maxWidth mx-auto py-8 px-4 bg-customCream">
    </header>
    <p class="font-bold text-6xl text-center my-8">CART</p>
    <table class="maxWidth mx-auto my-16 table-fixed min-h-[20vh]">
        <thead >
            <tr>
                <th class="w-[200px] font-medium">Product</th>
                <th class="w-[200px] font-medium">Size</th>
                <th class="w-[200px] font-medium">Quantity</th>
                <th class="w-[200px] font-medium">Amount</th>
                <th class="w-[100px] font-medium">Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <div id="delModalContainer" class="hidden fixed top-0 left-0 bottom-0 right-0 bg-black/20 items-center justify-center">
        <div class="min-w-[400px] min-h-fit bg-customCream shadow-md rounded-sm p-5 flex flex-col gap-4">
            <p id="delMsg"></p>
            <div class="flex gap-3">
                <button id="yesDelBtn" class="flex-1 border-none bg-customBlue text-customCream rounded-sm py-2">Yes</button>
                <button id="noDelBtn" class="flex-1 rounded-sm border border-customBlue  py-2">No</button>
            </div>
        </div>
    </div>
    <div class="flex flex-col items-end maxWidth mx-auto">
        <p id="total"></p>
        <a href="" class=" py-2 px-4 bg-customBlue text-customCream w-fit rounded-sm">Checkout</a>
    </div>
    <footer class="h-64 mt-56 flex items-start justify-around maxWidth mx-auto">
    </footer>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module">
    import { head, header, footer } from "/src/components/layout.js";
    import { allProd } from "/src/services/product_data.js";

    const tbody = document.querySelector('table tbody');

    function checkCart(cart){

        if(cart && cart.length > 0){
            const emptyCartMsg = document.getElementById('emptyCartMsg');
            if(emptyCartMsg){
                tbody.remove(emptyCartMsg);
            }

            cart.forEach(items => {
               const prod = allProd.find(prod => items.productId == prod.id);

               if(prod){
                    createCartItem(prod, items);
               }
            });
           
        }else{
            const tr = document.createElement('tr');
            tr.id = 'emptyCartMsg';

            const td = document.createElement('td');
            td.colSpan = 5;
        
            const i = document.createElement('i');
            i.setAttribute('data-lucide', 'shopping-basket');
            i.setAttribute('stroke', '#6b7280' );
            i.classList.add('mx-auto', 'size-10','mt-8');
            td.appendChild(i);

            const msg = document.createElement('p');
            msg.innerHTML = "Empty cart";
            msg.classList.add('text-gray-500', 'text-xl', 'text-center');
            td.appendChild(msg);

            tr.appendChild(td);
            tbody.appendChild(tr);

        }
        lucide.createIcons();
    }
    function updateAmount(quantity, price, displayAmount){
        displayAmount.innerHTML = `PHP ${quantity * price}`;
    }

    function deleteProduct(prodId, name, size,quantity){
        const delModalContainer = document.getElementById('delModalContainer');
        const delMsg = document.getElementById('delMsg');
        const noDelBtn = document.getElementById('noDelBtn');
        const yesDelBtn = document.getElementById('yesDelBtn');
        delModalContainer.classList.replace('hidden', 'flex');

        delMsg.innerText = `Do you want to remove [ ${name + ' ' + size + ' ' + quantity}x ] ?`;

        noDelBtn.addEventListener('click', ()=>{
          delModalContainer.classList.replace('flex', 'hidden');
        });

        yesDelBtn.addEventListener('click',()=>{
            const cart = JSON.parse(localStorage.getItem('userCart'));
            const excludeDelItem =  cart.filter(item => !(item.productId == prodId && item.productSize == size && item.userEmail == localStorage.getItem('currentUserEmail'))  ); 
 
            localStorage.setItem('userCart', JSON.stringify(excludeDelItem));
            delModalContainer.classList.replace('flex', 'hidden');
            window.location.href = "/src/pages/cart.html";
        });

    }
    function createCartItem(cartProdInfo, prod){
        const tr = document.createElement('tr');
        
        const product = document.createElement('td');
        const productInfoContainer = document.createElement('div');
        productInfoContainer.classList.add('flex','items-center', 'justify-start');
        const productImg = document.createElement('img');
        productImg.src = `/src/assets/product_image/${cartProdInfo.imageUrl}`;
        productImg.classList.add('rounded-sm', 'h-[80px]');
        productInfoContainer.appendChild(productImg);
        const productName = document.createElement('p');
        productName.innerText = cartProdInfo.name;
        productInfoContainer.appendChild(productName);

        product.appendChild(productInfoContainer);
        tr.appendChild(product);

        const userProdSize = document.createElement('td');
        userProdSize.classList.add('text-center');
        const size = document.createElement('p');
        size.innerHTML = prod.productSize;
        userProdSize.appendChild(size);
        tr.appendChild(userProdSize);

        const userProdQuant = document.createElement('td');
        const div = document.createElement('div');
        div.classList.add('flex', 'items-center', 'justify-center');
            const minusButton = document.createElement('button');
            minusButton.setAttribute('type', 'button');
            minusButton.id = 'minusBtn';
            minusButton.classList.add('px-2','border','border-gray-200','py-[6px]');
                const minusIcon = document.createElement('i');
                minusIcon.setAttribute('data-lucide','minus');
                minusIcon.setAttribute('stroke','#6b7280');
                minusIcon.classList.add('size-5');
                minusButton.appendChild(minusIcon);
        div.appendChild(minusButton);
        userProdQuant.appendChild(div);

        const quantityInput = document.createElement('input');
        quantityInput.classList.add('w-16','py-1', 'px-2',  'bg-transparent', 'border', 'focus:outline-none' ,'text-center');
        quantityInput.setAttribute('type', 'number');
        quantityInput.setAttribute('min', '1');
        quantityInput.id = 'quantity';
        quantityInput.value = prod.quantity;
        div.appendChild(quantityInput);
            const plusButton = document.createElement('button');
            plusButton.setAttribute('type', 'button');
            plusButton.id = 'plusBtn';
            plusButton.classList.add('px-2','border','border-gray-200','py-[6px]');
                const plusIcon = document.createElement('i');
                plusIcon.setAttribute('data-lucide','plus');
                plusIcon.setAttribute('stroke','#6b7280');
                plusIcon.classList.add('size-5');
                plusButton.appendChild(plusIcon);
            div.appendChild(plusButton);

        const userProdPrice = document.createElement('td');
        userProdPrice.classList.add('text-center');
        const amount = document.createElement('p');
        amount.innerHTML = `PHP ${prod.productPrice * prod.quantity}`;
        userProdPrice.appendChild(amount);

        const deleteTd = document.createElement('td');
        const deleteBtn = document.createElement('button');
        deleteBtn.classList.add( 'flex', 'mx-auto');
        const deleteIcon = document.createElement('i');
                deleteIcon.setAttribute('data-lucide','trash-2');
                deleteIcon.setAttribute('stroke','#FF0000');
                deleteIcon.classList.add('size-4');
                deleteBtn.appendChild(deleteIcon);
        deleteTd.appendChild(deleteBtn);

        tr.appendChild(userProdSize);
        tr.appendChild(userProdQuant);
        tr.appendChild(userProdPrice);
        tr.appendChild(deleteTd);
        tbody.appendChild(tr);

    minusButton.addEventListener('click', ()=>{   
                if(quantityInput.value <= 1){
                    quantityInput.value = 1;
                
                } else {
                    --quantityInput.value;
                }
                updateAmount(quantityInput.value, prod.productPrice, amount);
            });

    quantityInput.addEventListener('input', () => {
                if (quantityInput.value <= 0) {
                    quantityInput.value = 1; 
                }
            });
    quantityInput.addEventListener('change', ()=>{
                updateAmount(quantityInput.value, prod.productPrice, amount);
            });

    plusButton.addEventListener('click', ()=>{
                ++quantityInput.value;
                updateAmount(quantityInput.value, prod.productPrice, amount);
            });
    deleteBtn.addEventListener('click', ()=>{
        deleteProduct(prod.productId,cartProdInfo.name,prod.productSize,prod.quantity);
    });
    
        
    }

    document.addEventListener('DOMContentLoaded', ()=>{
        if(localStorage.getItem('currentUserEmail') == "null"){
        window.location.href = "/index.html";
        } else {
            head('Cart');
            header('Cart');
            footer();
            
            const cart = JSON.parse(localStorage.getItem('userCart')) || [];
            const userCart = ()=>{
                return cart.filter( items => items.userEmail == localStorage.getItem('currentUserEmail'));
            }
            
            checkCart(userCart());
        }
    });
   
</script>
</html>
