<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Azure Waves Café | Cart</title>
      <link rel="shortcut icon" href="/src/assets/logo/logo.png" type="image/x-icon">
      <link rel="stylesheet" href="/tailwind.css"> 
</head>
<body>
    <header class="flex items-center justify-between maxWidth mx-auto py-8 px-4 bg-customCream">
    </header>
    <p class="font-bold md:text-6xl xs:text-4xl text-center my-8">CART</p>
    <section class="flex flex-col gap-3 maxWidth w-fit mx-auto px-3  my-16 items-center">
        <table class=" table-fixed min-h-[20vh]">
            <thead class="text-sm border-b border-customBlue/60">
                <tr>
                    <th class="max-w-[200px] w-[200px] font-medium text-start">Product</th>
                    <th class="max-w-[200px] w-[200px] font-medium">Quantity</th>
                    <th class="max-w-[150px] w-[120px] font-medium">Amount</th>
                    <th class="w-fit font-medium">Actions</th>
                </tr>
            </thead>
            <tbody class="text-xs">
                <tr  id="emptyCartMsg" class="hidden">
                    <td colspan="4" >
                        <i data-lucide ='shopping-basket' stroke="#6b7280" class="mx-auto size-10 mt-8"></i>
                        <p class="text-gray-500 text-xl text-center">Empty cart</p>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="flex flex-col gap-3 text-sm items-end maxWidth px-4 self-end">
            <p id="total"></p>
            <button id="checkoutBtn" class=" py-2 px-4 bg-customBlue text-customCream w-fit rounded-sm">Checkout</button>
        </div>
    
    </section>
    

    <div id="delModalContainer" class="hidden fixed top-0 left-0 bottom-0 right-0 bg-black/20 items-center justify-center">
        <div class="max-w-[350px] min-h-fit bg-customCream shadow-md rounded-sm p-5 flex flex-col gap-4">
            <p id="delMsg"></p>
            <div class="flex gap-3">
                <button id="yesDelBtn" class="flex-1 border-none bg-customBlue text-customCream rounded-sm py-2">Yes</button>
                <button id="noDelBtn" class="flex-1 rounded-sm border border-customBlue  py-2">No</button>
            </div>
        </div>
    </div>
   
    <div id="checkOutModalContainer" class="hidden fixed top-0 left-0 bottom-0 right-0 bg-black/20 items-center justify-center">
        <div class="min-w-[400px] min-h-fit bg-customCream shadow-md rounded-sm p-5 flex flex-col gap-4">
            <p class="text-lg font-medium text-center pb-2 border-b-2 border-dashed border-customBlue/20">Is this order correct?</p>
            <ul id="items" class="list-none min-h-[150px] max-h-[200px] overflow-y-auto px-1">
                <!-- Check out item list -->
            </ul>
            <p id="checkOutAmt" class="text-end  border-t-2 mt-1 border-dashed border-customBlue/20 pt-2"></p>
            <div class="flex gap-3">
                <button id="yesBtn" class="flex-1 border-none bg-customBlue text-customCream rounded-sm py-2">Yes</button>
                <button id="noBtn" class="flex-1 rounded-sm border border-customBlue  py-2">No</button>
            </div>
        </div>
    </div>

    <div id="receiptModal" class="hidden fixed top-0 left-0 bottom-0 right-0 bg-black/20 items-center justify-center">
        <div class="max-w-[400px] min-h-fit bg-customCream shadow-md rounded-sm px-2 py-2 flex flex-col gap-4">
            <button id="closeReceiptModal" class="self-end">
            <i  data-lucide="x"  stroke="#284961"></i>
            </button>
            <div id="receipt" class="flex flex-col gap-3 px-3 py-4 bg-customCream">     
                <img src="/src/assets/logo/logo.png" alt="" srcset="" class="w-28 self-center">
                <p id="orderNumber" class="font-medium text-lg"></p>
                <div id="receiptDateTime" class="flex items-center justify-between pb-2 border-b border-customBlue">
                    <p id="date"></p>
                    <p id="time"></p>
                </div>
                <ul id="receiptItems" class="list-none px-1">
                    <!-- Check out item list -->
                </ul>
                <p id="receiptAmt" class="text-end  border-t-2 mt-2 border-dashed border-customBlue/20 pt-2"></p>
            </div>
            <p class="font-light text-wrap text-center mt-3">Please screenshot or download your receipt and proceed to the counter for your payment.</p>
            <button id="dlReceipt" class=" rounded-sm bg-customBlue text-customCream  py-2">Download Receipt</button>
        </div>
    </div>
    <div id="emptyCartCheckout" class="hidden fixed top-0 left-0 bottom-0 right-0 bg-black/20 items-center justify-center">
        <div class="max-w-[350px] min-h-fit bg-customCream shadow-md rounded-sm px-5 py-8 flex flex-col gap-4">
            <p class="text-lg font-medium text-center ">Please add product to checkout.</p>
            <button id="okayBtn" class=" border-none bg-customBlue text-customCream rounded-sm py-2">Okay</button> 
        </div>
    </div>
    <footer class="h-64 mt-40 flex flex-wrap items-start justify-around maxWidth mx-auto">
    </footer>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="/src/script/cart.js"></script>
</html>
