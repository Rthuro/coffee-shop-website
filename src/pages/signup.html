<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
    <main class="mx-auto flex flex-col items-center pt-32 h-[100vh]">
        <img src="/src/assets/logo/logo.png" alt="" srcset="" class="w-36 mx-auto">
        <p class="font-bold text-4xl text-center my-8">Sign up</p>
        <form action="" class="flex flex-col gap-2">
            <p id="signUpErr" class="text-sm text-red-600 font-light text-center"></p>
            <input type="email" name="" id="email" placeholder="Email" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <input type="password" name="" id="password" placeholder="Password" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <div class="my-1 flex gap-2 items-center">
                <input type="checkbox" name="showPassword" id="showPassword">
                <label for="showPassword" class="text-sm">Show Password</label>
            </div>
            <input type="password" name="" id="confirmPassword" placeholder="Confirm Password" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <p id="confirmPassErr" class="text-sm text-red-600 font-light"></p>
            <div class="my-1 flex gap-2 items-center">
                <input type="checkbox" name="showConfirmPassword" id="showConfirmPassword">
                <label for="showConfirmPassword" class="text-sm">Show Password</label>
            </div>
           <input type="submit" name="" value="Signup" class=" w-[300px] rounded-sm bg-customBlue text-customCream  py-2 px-2 ">
           <p class=" font-light text-sm self-center mt-2">Already have an account? <a href="./login.html" class="underline">Login</a> </p>
        </form>
    </main>

</body>
<script type="module">
    import  { head  }  from "/src/components/layout.js";
    head('Login');
    const form = document.querySelector('form');
    const email = document.getElementById('email');
    const showPassword = document.getElementById('showPassword');
    const password = document.getElementById('password');
    const showConfirmPassword = document.getElementById('showConfirmPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const confirmPassErr = document.getElementById('confirmPassErr');
    const signUpErr = document.getElementById('signUpErr');

    showPassword.addEventListener('change', ()=>{
        password.type = showPassword.checked ? 'text' : 'password';
    });

    showConfirmPassword.addEventListener('change', ()=>{
        confirmPassword.type = showConfirmPassword.checked ? 'text' : 'password';
    });

    email.addEventListener('input', ()=>{
        email.style.borderColor = email.value == ''? 'red':'#284961';
    });
    password.addEventListener('input', ()=>{
        password.style.borderColor = password.value == ''? 'red':'#284961';
    });
    confirmPassword.addEventListener('input', ()=>{
        confirmPassword.style.borderColor = confirmPassword.value == ''? 'red':'#284961';
    });

    form.onsubmit = (e)=>{
        e.preventDefault();

        if(email.value !== '' && password.value !== '' && confirmPassword !== ''){
            if(password.value == confirmPassword.value){
                 // convert string to object using JSON.parse
                const checkIfUserExists = JSON.parse(localStorage.getItem('users'));

                if(checkIfUserExists){
                    for(let i =0; i < checkIfUserExists.length; i++){

                        if(checkIfUserExists[i].email == email.value && checkIfUserExists[i].password == password.value){
                            signUpErr.innerHTML = 'User already exists.';
                            break;
                        }else{
                            
                            const user ={ email: email.value,
                                password:password.value, };
                            
                            //If no users exist, initialized an empty array
                            const users = JSON.parse(localStorage.getItem('users')) || [];
                            users.push(user);

                            localStorage.setItem('users', JSON.stringify(users));
                            window.location.href = './login.html';
                            break;
                        }
                    }
                }else{
                            const user ={ email: email.value,
                                password:password.value, };
                            
                            //If no users exist, initialized an empty array
                            const users = JSON.parse(localStorage.getItem('users')) || [];
                            users.push(user);

                            localStorage.setItem('users', JSON.stringify(users));
                            window.location.href = './login.html';
                        }
                
                
            } else {
                confirmPassErr.innerHTML = 'Password and confirm password do not match.';
            } 
        } else {
            email.style.borderColor = email.value == ''? 'red':'#284961';
            password.style.borderColor = password.value == ''? 'red':'#284961';
            confirmPassword.style.borderColor = confirmPassword.value == ''? 'red':'#284961';
        }
    }

   

</script>
</html>
