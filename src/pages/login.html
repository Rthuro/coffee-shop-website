<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Azure Waves Café | Login</title>
      <link rel="shortcut icon" href="/src/assets/logo/logo.png" type="image/x-icon">
      <link rel="stylesheet" href="/tailwind.css"> 
</head>
<body>
    <main class="mx-auto flex flex-col items-center pt-32 h-[100vh]">
        <img src="/src/assets/logo/logo.png" alt="" srcset="" class="w-36 mx-auto">
        <p class="font-bold text-4xl text-center my-8">Welcome Back!</p>
        <form action="" class="flex flex-col gap-2">
            <p id="confirmLogin" class="text-sm text-red-600 font-light text-center"></p>
            <input type="email" name="" id="email" placeholder="Email" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <input type="password" name="" id="password" placeholder="Password" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <div class="my-1 flex gap-2 items-center">
                <input type="checkbox" name="showPassword" id="showPassword">
                <label for="showPassword" class="text-sm">Show Password</label>
            </div>
           <input type="submit" name="" value="Login" id="" class=" w-[300px] rounded-sm bg-customBlue text-customCream  py-2 px-2 ">
           <p class=" font-light text-sm self-center mt-2"> Don't have an account? <a href="/signup" class="underline">Sign up</a> </p>
        </form>
    </main>

</body>
<script type="module" src="/src/script/login.js"></script>
</html>
