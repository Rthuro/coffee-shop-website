<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
    <main class="mx-auto flex flex-col items-center pt-32 h-[100vh]">
        <img src="/src/assets/logo/logo.png" alt="" srcset="" class="w-36 mx-auto">
        <p class="font-bold text-4xl text-center my-8">Welcome Back!</p>
        <form action="" class="flex flex-col gap-2">
            <p id="confirmLogin" class="text-sm text-red-600 font-light"></p>
            <input type="email" name="" id="email" placeholder="Email" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <input type="password" name="" id="password" placeholder="Password" class=" w-[300px] rounded-sm bg-customCream border border-customBlue py-2 px-2 focus:bg-customCream focus:outline-none">
            <div class="my-1 flex gap-2 items-center">
                <input type="checkbox" name="showPassword" id="showPassword">
                <label for="showPassword" class="text-sm">Show Password</label>
            </div>
           <input type="submit" name="" value="Login" id="" class=" w-[300px] rounded-sm bg-customBlue text-customCream  py-2 px-2 ">
           <p class=" font-light text-sm self-center mt-2"> Don't have an account? <a href="./signup.html" class="underline">Sign up</a> </p>
        </form>
    </main>

</body>
<script src="../components/head.js"></script>
<script>
    head('Login');
    const form = document.querySelector('form');
    const confirmLogin = document.getElementById('confirmLogin');
    const email = document.getElementById('email');
    const showPassword = document.getElementById('showPassword');
    const password = document.getElementById('password');

    email.addEventListener('input', ()=>{
        email.style.borderColor = email.value == ''? 'red':'#284961';
    });
    password.addEventListener('input', ()=>{
        password.style.borderColor = password.value == ''? 'red':'#284961';
    });
    showPassword.addEventListener('change', ()=>{
        password.type = showPassword.checked ? 'text' : 'password';
    });

    form.onsubmit = (e)=>{
        e.preventDefault();

        if(!email.value == '' && !password.value == '' ){
            const users = JSON.parse(localStorage.getItem('users'));

            let noUserFound = true;
            if(users){
                for(let i =0; i < users.length; i++){
                    if(users[i].email == email.value && users[i].password == password.value){
                        localStorage.setItem('currentUserEmail',email.value);
                        localStorage.setItem('currentUserPass',password.value);
                        window.location.href = '/index.html';
                        break;
                    }else{
                        noUserFound = false;
                    }
                }
            }
            
            if(noUserFound){
                confirmLogin.innerHTML = 'User not found.';
            }

        } else {
            email.style.borderColor = email.value == ''? 'red':'#284961';
            password.style.borderColor = password.value == ''? 'red':'#284961';
        }
    }

</script>
</html>
