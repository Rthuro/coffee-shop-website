<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
    <header class="flex items-center justify-between maxWidth mx-auto py-8 px-4 bg-customCream">
    </header>
    <p class="font-bold text-6xl text-center my-8">MENU</p>
    <p class="text-center font-light">Our Coastal Creations</p>
    <form action="" class="flex items-center justify-center my-12 maxWidth mx-auto">
    
        <input type="text" placeholder="Search" name=""  id="search" class="border border-customBlue rounded-sm py-2 pl-3 pr-8 bg-customCream focus:bg-customCream w-1/2 font-light focus:outline-none focus:shadow-md ">
        <i data-lucide="search" stroke="#284961" class="-m-8 size-5"></i>
     
    </form>
    <main class="mx-auto maxWidth flex flex-col gap-3">
        <div id="allProdContainer" class="grid grid-cols-3 grid-rows-1">
        </div>
        <p class="mx-auto text-xl font-light"></p>
    </main>
    <footer class="h-64 mt-56 flex items-start justify-around maxWidth mx-auto">
    </footer>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../components/head.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>
<script src="../services/product_data.js"></script>
<script>
    lucide.createIcons();
    head('Coastal Creations');
    header('Coastal Creations');
    const allProdContainer = document.getElementById('allProdContainer');
    const main = document.querySelector('main');
    const noResultMsg = document.querySelector('main p');
    const search = document.getElementById('search');
    const form = document.querySelector('form');
    let result = 0;
    function prod(search){
        allProdContainer.innerHTML = '';
        noResultMsg.innerHTML = '';
        result = 0;

        allProd.forEach(prod => {
            if (search === '' || prod.name.toLowerCase().includes(search.toLowerCase())
              ){
                const div = document.createElement('div');
                div.classList.add('max-w-[300px]','h-fit', 'flex', 'flex-col', 'items-center', 'gap-2','cursor-pointer');
                div.id = prod.id;
                const img = document.createElement('img');
                img.classList.add('h-[70%]', 'hover:scale-105', 'ease-in','duration-200');
                img.src = `/src/assets/product_image/${prod.imageUrl}`;
                div.appendChild(img);

                const name  = document.createElement('p');
                name.classList.add('font-medium', 'select-none');
                name.innerHTML = prod.name.toLocaleUpperCase();
                div.appendChild(name);

                const price  = document.createElement('p');
                price.classList.add('font-light', 'text-sm', 'select-none');
                price.innerHTML = `PHP ${prod.price.toFixed(2)}`;
                div.appendChild(price);

                allProdContainer.appendChild(div);

                result++;
            } 
        });


    }


    prod(search.value);

    form.onsubmit = (e)=>{
            e.preventDefault();
            prod(search.value);
            if(result == 0){
                noResultMsg.innerHTML = `No product name "${search.value}"`;
            }
    };


</script>
</html>
