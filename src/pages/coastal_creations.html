<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Azure Waves Café | Coastal Creations</title>
      <link rel="shortcut icon" href="/src/assets/logo/logo.png" type="image/x-icon">
      <link rel="stylesheet" href="/tailwind.css"> 
</head>
<body>
    <header class="flex items-center justify-between maxWidth mx-auto py-8 px-4 bg-customCream">
    </header>
    <p class="font-bold text-6xl text-center my-8">MENU</p>
    <p class="text-center font-light">Our Coastal Creations</p>
    <form action="" class="relative my-12 w-fit flex items-center mx-auto">
    
        <input type="text" placeholder="Search" name=""  id="search" class="border border-customBlue rounded-sm py-2 pl-3 pr-8 bg-customCream focus:bg-customCream sm:w-[400px] xs:w-[250px] font-light focus:outline-none focus:shadow-md ">
        <i data-lucide="search" stroke="#284961" class="absolute right-3 size-5"></i>
     
    </form>
    <main class="mx-auto maxWidth flex flex-col gap-3">
        
        <div id="allProdContainer" class="grid md:grid-cols-3 xs:grid-cols-2 px-3">
        </div>
        <p class="mx-auto text-xl font-light"></p>
    </main>
    <footer class="h-64 mt-40 flex flex-wrap items-start justify-around maxWidth mx-auto">
    </footer>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module">
    import  { header, footer  }  from "/src/components/layout.js";
    import  { allProd }  from "/src/services/product_data.js";

    header('Coastal Creations');
    footer();
    lucide.createIcons();
    const allProdContainer = document.getElementById('allProdContainer');
    const main = document.querySelector('main');
    const noResultMsg = document.querySelector('main p');
    const search = document.getElementById('search');
    const form = document.querySelector('form');
    let result = 0;
    function prod(search){
        allProdContainer.innerHTML = '';
        noResultMsg.innerHTML = '';
        result = 0;

        allProd.forEach(prod => {
            if (search === '' || prod.name.toLowerCase().includes(search.toLowerCase())
              ){
                const div = document.createElement('div');
                div.classList.add('max-w-[300px]','h-fit', 'flex', 'flex-col', 'items-center', 'gap-2','cursor-pointer','overflow-hidden');
                div.id = prod.id;
                const img = document.createElement('img');
                img.classList.add('max-h-[300px]', 'hover:scale-105', 'ease-in','duration-200');
                img.src = `/src/assets/product_image/${prod.imageUrl}`;
                div.appendChild(img);

                const name  = document.createElement('p');
                name.classList.add('font-medium', 'select-none','text-center');
                name.innerHTML = prod.name.toLocaleUpperCase();
                div.appendChild(name);

                const price  = document.createElement('p');
                price.classList.add('font-light', 'text-sm', 'select-none');
                price.innerHTML = `PHP ${prod.price.toFixed(2)}`;
                div.appendChild(price);

                allProdContainer.appendChild(div);

                div.addEventListener('click', ()=>{
                window.location.href = `/src/pages/view_product.html?id=${prod.id}`
                });

                result++;
            } 

            
        });


    }


    prod(search.value);

    form.onsubmit = (e)=>{
            e.preventDefault();
            prod(search.value);
            if(result == 0){
                noResultMsg.innerHTML = `No product name "${search.value}"`;
            }
    };


</script>
</html>
